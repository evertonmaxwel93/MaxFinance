name: Monitoramento Diário de Preços de Concorrentes

on:
  schedule:
    # Roda todos os dias às 05:00 UTC (02:00 Horário de Brasília)
    - cron: '0 5 * * *'
  workflow_dispatch:
    # Permite rodar o monitoramento manualmente pelo painel do GitHub

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json' # Opcional se houver lockfile futuramente

      - name: Inicializar Projeto e Instalar Dependências
        run: |
          npm init -y
          npm install @supabase/supabase-js @google/generative-ai playwright
          
      - name: Instalar Navegador Chromium do Playwright
        run: |
          npx playwright install chromium --with-deps

      - name: Executar Robô de Coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node cron/scraper.js
