<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaxFinance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

    <div id="login-section" class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center">
        <h1 class="text-3xl font-bold text-slate-800 mb-2">MaxFinance</h1>
        <button onclick="loginComGoogle()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 mt-4">
            Entrar com o Google
        </button>
    </div>

    <div id="app-section" class="hidden w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 flex flex-col h-full self-start mt-4">
        
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Painel</h1>
                <p id="user-info" class="text-sm text-slate-500">Logado como...</p>
            </div>
            <button onclick="sair()" class="text-sm text-red-500 hover:text-red-700 font-medium">Sair</button>
        </div>

        <div class="flex gap-4 mb-6">
            <button onclick="mudarAba('aba-lancamento')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-medium">Lançamento</button>
            <button onclick="mudarAba('aba-configuracoes')" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 rounded font-medium">Configurações</button>
        </div>

        <div id="aba-lancamento">
            <form id="transacao-form" class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Categoria</label>
                        <select id="tipo" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none" onchange="carregarSelectSubcategorias()">
                            <option value="Saída">Saída (Despesa)</option>
                            <option value="Entrada">Entrada (Receita)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Subcategoria</label>
                        <select id="subcategoria" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none" required></select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Descrição</label>
                        <input type="text" id="descricao" required class="w-full border border-slate-300 rounded-lg p-2.5 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Valor da Parcela (R$)</label>
                        <input type="number" step="0.01" id="valor" required class="w-full border border-slate-300 rounded-lg p-2.5 outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Qtd. Parcelas (0 = Recorrente)</label>
                        <input type="number" id="parcelas" value="1" min="0" required class="w-full border border-slate-300 rounded-lg p-2.5 outline-none" onchange="verificarParcelamento()">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1" id="label-data">Data de Vencimento</label>
                        <input type="date" id="data_inicio" required class="w-full border border-slate-300 rounded-lg p-2.5 outline-none">
                    </div>
                </div>

                <div id="div-frequencia" class="hidden">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Forma de Parcelamento</label>
                    <select id="frequencia" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none">
                        <option value="Mensal">Mensal</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Anual">Anual</option>
                    </select>
                </div>

                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-lg mt-4">Salvar Lançamento</button>
            </form>
        </div>

        <div id="aba-configuracoes" class="hidden">
            <h2 class="text-xl font-bold mb-4">Gerenciar Subcategorias</h2>
            <form id="form-subcategoria" class="flex gap-4 mb-6">
                <select id="novo-sub-tipo" class="border border-slate-300 rounded-lg p-2.5 outline-none">
                    <option value="Saída">Saída</option>
                    <option value="Entrada">Entrada</option>
                </select>
                <input type="text" id="novo-sub-nome" placeholder="Nome da subcategoria" required class="flex-1 border border-slate-300 rounded-lg p-2.5 outline-none">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">Adicionar</button>
            </form>

            <div class="grid grid-cols-2 gap-6">
                <div>
                    <h3 class="font-semibold text-red-600 border-b pb-2 mb-2">Saídas</h3>
                    <ul id="lista-sub-saidas" class="space-y-2"></ul>
                </div>
                <div>
                    <h3 class="font-semibold text-green-600 border-b pb-2 mb-2">Entradas</h3>
                    <ul id="lista-sub-entradas" class="space-y-2"></ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://rkwoerrsicftcjgaakte.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_ug1NkS3w4DACmOIpiafAAA_yQtSud7-';
        const clienteSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let userAtual = null;
        let subcategoriasGlobais = [];

        async function loginComGoogle() { await clienteSupabase.auth.signInWithOAuth({ provider: 'google' }); }
        async function sair() { await clienteSupabase.auth.signOut(); verificarSessao(); }

        async function verificarSessao() {
            const { data: { session } } = await clienteSupabase.auth.getSession();
            if (session) {
                userAtual = session.user;
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-info').textContent = session.user.email;
                carregarSubcategoriasBanco();
            } else {
                userAtual = null;
                document.getElementById('login-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }
        verificarSessao();
        clienteSupabase.auth.onAuthStateChange(() => verificarSessao());

        function mudarAba(abaId) {
            document.getElementById('aba-lancamento').classList.add('hidden');
            document.getElementById('aba-configuracoes').classList.add('hidden');
            document.getElementById(abaId).classList.remove('hidden');
        }

        // --- LÓGICA DE SUBCATEGORIAS ---
        async function carregarSubcategoriasBanco() {
            const { data, error } = await clienteSupabase.from('subcategorias').select('*').order('nome', { ascending: true });
            if (!error) {
                subcategoriasGlobais = data;
                renderizarListasConfiguracao();
                carregarSelectSubcategorias();
            }
        }

        function renderizarListasConfiguracao() {
            const listaSaidas = document.getElementById('lista-sub-saidas');
            const listaEntradas = document.getElementById('lista-sub-entradas');
            listaSaidas.innerHTML = ''; listaEntradas.innerHTML = '';

            subcategoriasGlobais.forEach(sub => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-slate-100 p-2 rounded text-sm';
                li.innerHTML = `<span>${sub.nome}</span> <button onclick="deletarSubcategoria('${sub.id}')" class="text-red-500 hover:underline">Excluir</button>`;
                
                if (sub.tipo === 'Saída') listaSaidas.appendChild(li);
                else listaEntradas.appendChild(li);
            });
        }

        function carregarSelectSubcategorias() {
            const tipo = document.getElementById('tipo').value;
            const select = document.getElementById('subcategoria');
            select.innerHTML = '';
            
            const filtradas = subcategoriasGlobais.filter(s => s.tipo === tipo);
            if (filtradas.length === 0) {
                select.innerHTML = '<option value="">Nenhuma subcategoria cadastrada</option>';
            } else {
                filtradas.forEach(sub => {
                    select.innerHTML += `<option value="${sub.nome}">${sub.nome}</option>`;
                });
            }
        }

        document.getElementById('form-subcategoria').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tipo = document.getElementById('novo-sub-tipo').value;
            const nome = document.getElementById('novo-sub-nome').value;

            const { error } = await clienteSupabase.from('subcategorias').insert([{ user_id: userAtual.id, tipo, nome }]);
            if (!error) {
                document.getElementById('novo-sub-nome').value = '';
                carregarSubcategoriasBanco();
            } else alert("Erro ao adicionar: " + error.message);
        });

        async function deletarSubcategoria(id) {
            const { error } = await clienteSupabase.from('subcategorias').delete().eq('id', id);
            if (!error) carregarSubcategoriasBanco();
        }

        // --- LÓGICA DE TRANSAÇÕES ---
        function verificarParcelamento() {
            const parcelas = parseInt(document.getElementById('parcelas').value);
            const divFreq = document.getElementById('div-frequencia');
            const labelData = document.getElementById('label-data');
            
            if (parcelas === 1) {
                divFreq.classList.add('hidden');
                labelData.textContent = "Data de Vencimento";
            } else {
                divFreq.classList.remove('hidden');
                labelData.textContent = "Data da 1ª Parcela";
            }
        }

        function adicionarMes(dataBase, meses) {
            let novaData = new Date(dataBase);
            let diaOriginal = novaData.getDate();
            novaData.setMonth(novaData.getMonth() + meses);
            if (novaData.getDate() !== diaOriginal) novaData.setDate(0); 
            return novaData;
        }

        document.getElementById('transacao-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const subcategoria = document.getElementById('subcategoria').value;
            if (!subcategoria) {
                alert("Cadastre uma subcategoria em Configurações primeiro.");
                return;
            }

            const tipo = document.getElementById('tipo').value;
            const descricao = document.getElementById('descricao').value;
            const valor = parseFloat(document.getElementById('valor').value);
            const dataBase = new Date(document.getElementById('data_inicio').value + 'T12:00:00'); 
            const parcelasTotal = parseInt(document.getElementById('parcelas').value);
            const frequencia = parcelasTotal === 1 ? 'Única' : document.getElementById('frequencia').value;

            // Gera UUID único para o grupo de parcelas
            const grupo_id = crypto.randomUUID();
            const iteracoes = parcelasTotal === 0 ? 12 : parcelasTotal;
            let insercoes = [];

            for (let i = 0; i < iteracoes; i++) {
                let dataParcela = new Date(dataBase);

                if (frequencia === 'Mensal') dataParcela = adicionarMes(dataBase, i);
                else if (frequencia === 'Semanal') dataParcela.setDate(dataBase.getDate() + (i * 7));
                else if (frequencia === 'Anual') dataParcela.setFullYear(dataBase.getFullYear() + i);

                insercoes.push({
                    user_id: userAtual.id,
                    grupo_id: grupo_id,
                    tipo, subcategoria, descricao,
                    valor_parcela: valor,
                    data_vencimento: dataParcela.toISOString().split('T')[0],
                    parcela_atual: i + 1,
                    total_parcelas: parcelasTotal,
                    frequencia
                });
            }

            const { error } = await clienteSupabase.from('transacoes').insert(insercoes);

            if (error) {
                alert("Erro ao salvar: " + error.message);
            } else {
                alert("Lançamento salvo com sucesso!");
                document.getElementById('transacao-form').reset();
                verificarParcelamento();
            }
        });
    </script>
</body>
</html>
